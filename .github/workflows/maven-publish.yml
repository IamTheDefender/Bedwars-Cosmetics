name: Gradle Release Build

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Build release artifact
      run: ./gradlew build
    - name: Upload shaded jar
      uses: actions/upload-artifact@v4
      with:
        name: BedWars-Cosmetics
        path: build/BedWars-Cosmetics-v*.jar
