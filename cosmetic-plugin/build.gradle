plugins {
    id 'com.gradleup.shadow'
}

sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

def versionSupport120Jar = project(':versionsupport_1_20').tasks.named('jar')

dependencies {
    implementation project(':cosmetic-api')
    implementation project(':versionsupport_1_8_R3')
    implementation files(versionSupport120Jar)

    implementation 'net.byteflux:libby-bukkit:1.3.0'
    implementation 'com.github.cryptomorin:XSeries:13.7.0'
    implementation 'co.aikar:acf-paper:0.5.1-SNAPSHOT'
    implementation 'de.rapha149.signgui:signgui:2.5.4'

    compileOnly 'org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly 'com.github.retrooper:packetevents-spigot:2.12.1'
    compileOnly 'com.zaxxer:HikariCP:5.1.0'
    compileOnly 'org.slf4j:slf4j-api:2.0.7'
    compileOnly 'it.unimi.dsi:fastutil:8.5.9'
    compileOnly 'org.mongodb:mongodb-driver-sync:5.1.0'
    compileOnly 'redis.clients:jedis:5.2.0'

    compileOnly 'com.github.NEZNAMY:TAB-API:6.0.0'

    compileOnly files(
            'lib/bedwars-plugin-23.12.2.jar',
            'lib/bedwars2023-1.0.jar',
            'lib/proxy-plugin-1.2.4.jar',
            'lib/proxy-plugin-1.0-SNAPSHOT (1).jar',
            'lib/BedWars-0.2.42.1.jar'
    )
}

tasks.named('jar') {
    archiveFileName = "cosmetic-plugin-${project.version}.jar"
}

tasks.named('compileJava') {
    dependsOn versionSupport120Jar
}

tasks.named('shadowJar') {
    dependsOn versionSupport120Jar
    archiveFileName = "BedWars-Cosmetics-v${project.version}.jar"
    archiveClassifier = ''
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs').get().asFile
    relocate 'com.cryptomorin.xseries', 'xyz.iamthedefender.cosmetics.support.xseries'
    relocate 'co.aikar.commands', 'xyz.iamthedefender.cosmetics.support.aikar'
    relocate 'co.aikar.locales', 'xyz.iamthedefender.cosmetics.support.aikar'
    relocate 'com.zaxxer.hikari', 'xyz.iamthedefender.cosmetics.support.hikari'
    relocate 'de.rapha149.signgui', 'xyz.iamthedefender.cosmetics.support.signgui'

    dependencies {
        exclude(dependency('org.projectlombok:lombok'))
    }

    exclude 'com/cryptomorin/xseries/XBiome*'
    exclude 'com/cryptomorin/xseries/NMSExtras*'
    exclude 'com/cryptomorin/xseries/NoteBlockMusic*'
    exclude 'com/cryptomorin/xseries/SkullCacheListener*'
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}


tasks.register('prepareKotlinBuildScriptModel') {}